    align-items: center;
    pointer-events: none;
    background: rgba(0,0,0,0.6);
    opacity: 0;
    transition: opacity 0.2s;

  #overlay h2 { color: #fff; font-size: 18px; margin-bottom: 20px; }

// ========== AUDIO ==========
const Audio = {
  ctx: null, bgGain: null, bgPlaying: false, bgTimer: null,

  ensure() {
    if (!this.ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      this.ctx = new C();
      this.bgGain = this.ctx.createGain();
      this.bgGain.gain.value = 0.08;
      this.bgGain.connect(this.ctx.destination);
    }
  },

  shoot() {
    if (!G.soundOn) return;
    this.ensure();
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'square';
    o.connect(g); g.connect(this.ctx.destination);
    const t = this.ctx.currentTime;
    o.frequency.setValueAtTime(1200, t);
    o.frequency.exponentialRampToValueAtTime(300, t + 0.08);
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    o.start(t); o.stop(t + 0.08);
  },

  hit() {
    if (!G.soundOn) return;
    this.ensure();
    const n = this.ctx.sampleRate * 0.25;
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 2;
    const s = this.ctx.createBufferSource();
    s.buffer = buf;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
    s.connect(g); g.connect(this.ctx.destination);
    s.start();
  },

  explode() {
    if (!G.soundOn) return;
    this.ensure();
    const n = this.ctx.sampleRate * 0.4;
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource();
    s.buffer = buf;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.35, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
    s.connect(g); g.connect(this.ctx.destination);
    s.start();
  },

  gameover() {
    if (!G.soundOn) return;
    this.ensure();
    const t = this.ctx.currentTime;
    [523, 440, 349, 262].forEach((f, i) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'square';
      o.connect(g); g.connect(this.ctx.destination);
      const tt = t + i * 0.25;
      o.frequency.setValueAtTime(f, tt);
      g.gain.setValueAtTime(0.15, tt);
      g.gain.exponentialRampToValueAtTime(0.001, tt + 0.22);
      o.start(tt); o.stop(tt + 0.25);
    });
  },

  startBG() {
    this.ensure();
    this.stopBG();
    this.bgPlaying = true;
    this._bgLoop();
  },

  stopBG() {
    this.bgPlaying = false;
    if (this.bgTimer) { clearTimeout(this.bgTimer); this.bgTimer = null; }
  },

  _bgLoop() {
    if (!this.bgPlaying) return;
    if (!G.soundOn) { this.bgTimer = setTimeout(() => this._bgLoop(), 500); return; }
    const melody = [262,294,330,349,392,349,330,294, 262,330,392,523,392,330,294,262];
    const bass   = [131,131,131,131, 165,165,165,165, 131,131,131,131, 175,175,175,175];
    const t = this.ctx.currentTime;
    const noteLen = 0.18;
    melody.forEach((f, i) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'square';
      o.connect(g); g.connect(this.bgGain);
      const tt = t + i * noteLen;
      o.frequency.setValueAtTime(f, tt);
      g.gain.setValueAtTime(0.06, tt);
      g.gain.setValueAtTime(0.06, tt + noteLen * 0.7);
      g.gain.exponentialRampToValueAtTime(0.001, tt + noteLen);
      o.start(tt); o.stop(tt + noteLen + 0.01);
    });
    bass.forEach((f, i) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'triangle';
      o.connect(g); g.connect(this.bgGain);
      const tt = t + i * noteLen;
      o.frequency.setValueAtTime(f, tt);
      g.gain.setValueAtTime(0.08, tt);
      g.gain.exponentialRampToValueAtTime(0.001, tt + noteLen * 1.5);
      o.start(tt); o.stop(tt + noteLen * 1.6);
    });
    this.bgTimer = setTimeout(() => this._bgLoop(), melody.length * noteLen * 1000 - 50);
  }
};

// ========== GAME STATE ==========
let G = null;

class Tank {
  constructor(x, y, dir, isPlayer, etype=0) {
    this.x = x; this.y = y;
    this.dir = dir;
    this.isPlayer = isPlayer;
    this.alive = true;
    this.etype = etype; // enemy type index
    this.hp = isPlayer ? 1 : ENEMY[etype].hp;
    this.speed = isPlayer ? 1.4 : ENEMY[etype].speed;
    this.size = 22;
    this.cooldown = 0;
    this.invincible = isPlayer ? 2000 : 0;
    this.moveTimer = 0;
    this.aiDir = dir;
    this.aiChange = 0;
    this.hasPowerup = false;
  }
  get cx() { return this.x + this.size/2; }
  get cy() { return this.y + this.size/2; }
}

class Bullet {
  constructor(x, y, dir, isEnemy, owner, power=0) {
    this.x = x; this.y = y;
    this.dir = dir; this.isEnemy = isEnemy;
    this.owner = owner; this.alive = true;
    this.power = power; // 0=normal, 1+=can break steel
    this.speed = isEnemy ? 2.5 : (power >= 2 ? 5 : 3.5);
  }
}

class Powerup {
  constructor(x, y, type) {
    this.x = x; this.y = y;
    this.type = type;
    this.alive = true;
    this.timer = 10000;
    this.bob = 0;
  }
}

// ========== GAME ==========
function newGame() {
  return {
    mapIdx: 0, grid: [], score: 0, highScore: +localStorage.getItem('battleCityHigh') || 0, lives: 3, wave: 0,
    fireLevel: 0, // 0=basic, 1=steel-break, 2=fast+steel-break
    player: null, enemies: [], bullets: [], effects: [], popups: [], powerups: [],
    spawnQ: [], spawnTimer: 0, maxEnemy: 4,
    state: 'menu', keys: {}, baseAlive: true, soundOn: true,
    stageIntroTimer: 0,
    freezeTimer: 0,
    spawnIdx: 0,
    px: 12, py: 24,
    bx: 13, by: 25,
  };
}

function loadMap(idx) {
  G.grid = [];
  for (let r = 0; r < ROW; r++) {
    G.grid[r] = [];
    for (let c = 0; c < COL; c++) {
      G.grid[r][c] = MAPS[idx] ? (MAPS[idx][r] ? MAPS[idx][r][c] : 0) : 0;
    }
  }
}

function startGame() {
  G.state = 'stageIntro';
  G.stageIntroTimer = 1000;
  ol.classList.remove('show');
  G.wave = 0;
  G.score = 0;
  G.fireLevel = 0;
  G.lives = 3;
  G.baseAlive = true;
  G.player = null;
  G.enemies = [];
  G.bullets = [];
  G.effects = [];
  G.popups = [];
  G.powerups = [];
  G.freezeTimer = 0;
  loadMap(G.mapIdx);
  spawnWave();
  Audio.startBG();
  updateUI();
}

function spawnWave() {
  G.wave++;
  let n = 6 + G.wave * 2;
  G.spawnQ = [];
  for (let i = 0; i < n; i++) G.spawnQ.push(1);
  G.spawnTimer = 0;
  updateUI();
}

function spawnPlayer() {
  if (G.player) return;
  let x = G.px * CS + (CS - 22) / 2;
  let y = G.py * CS + (CS - 22) / 2;
  G.player = new Tank(x, y, U, true);
  G.player.invincible = 2000;
}

function rollEnemyType() {
  let r = Math.random();
  if (G.wave >= 4 && r < 0.2) return 2;
  if (G.wave >= 2 && r < 0.35) return 1;
  return 0;
}

function spawnEnemy() {
  if (G.spawnQ.length === 0 || G.enemies.length >= G.maxEnemy) return;
  let pts = [{x:0,y:0},{x:12,y:0},{x:24,y:0}];
  for (let i = 0; i < pts.length; i++) {
    let idx = (G.spawnIdx + i) % pts.length;
    let p = pts[idx];
    let sx = p.x * CS + (CS - 22) / 2;
    let sy = p.y * CS + (CS - 22) / 2;
    let ok = true;
    for (let t of [G.player, ...G.enemies]) {
      if (!t || !t.alive) continue;
      if (Math.abs(t.x - sx) < 40 && Math.abs(t.y - sy) < 40) { ok = false; break; }
    }
    if (ok) {
      let e = new Tank(sx, sy, D, false, rollEnemyType());
      if (Math.random() < 0.25) e.hasPowerup = true;
      G.enemies.push(e);
      G.spawnQ.pop();
      G.spawnIdx = (G.spawnIdx + 1) % pts.length;
      let spawnColor = e.hasPowerup ? '#ff3030' : (e.etype === 2 ? '#aaa' : (e.etype === 1 ? '#ccc' : '#ddd'));
      addEffect(sx, sy, 200, spawnColor);
      updateUI();
      return;
    }
  }
}

function addEffect(x, y, dur, color) {
  G.effects.push({ x, y, t: dur, max: dur, color: color || '#ff8020' });
}

function addPopup(x, y, text, color) {
  G.popups.push({ x, y, text, color: color || '#fff', t: 800, max: 800 });
}

function spawnPowerup(x, y) {
  if (G.powerups.length >= 2) return;
  let types = [PT_STAR, PT_SHIELD, PT_TANK, PT_CLOCK, PT_GRENADE];
  let type = types[Math.floor(Math.random() * types.length)];
  // Snap to grid
  let gx = Math.floor(x / CS) * CS + 2;
  let gy = Math.floor(y / CS) * CS + 2;
  G.powerups.push(new Powerup(gx, gy, type));
}

// ========== COLLISION ==========
function rectHit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function canMove(tank, nx, ny) {
  if (nx < 0 || ny < 0 || nx + tank.size > W || ny + tank.size > H) return false;
  let l = Math.floor(nx / CS), r = Math.floor((nx + tank.size - 1) / CS);
  let t = Math.floor(ny / CS), b = Math.floor((ny + tank.size - 1) / CS);
  for (let row = t; row <= b; row++) {
    for (let col = l; col <= r; col++) {
      if (row < 0 || row >= ROW || col < 0 || col >= COL) return false;
      let v = G.grid[row][col];
      if (v === BRICK || v === STEEL || v === BASE) return false;
    }
  }
  let others = tank.isPlayer ? G.enemies : (G.player ? [G.player, ...G.enemies.filter(e => e !== tank)] : G.enemies.filter(e => e !== tank));
  for (let ot of others) {
    if (!ot || !ot.alive) continue;
    if (nx < ot.x + ot.size && nx + tank.size > ot.x && ny < ot.y + ot.size && ny + tank.size > ot.y) return false;
  }
  return true;
}

function fireBullet(tank) {
  if (tank.cooldown > 0) return;
  let n = 0;
  for (let b of G.bullets) { if (b.owner === tank && b.alive) n++; }
  if (n >= (tank.isPlayer ? 2 : 1)) return;
  let cx = tank.x + tank.size/2 - 2;
  let cy = tank.y + tank.size/2 - 2;
  let bx = cx + DX[tank.dir] * (tank.size/2 + 1);
  let by = cy + DY[tank.dir] * (tank.size/2 + 1);
  let power = tank.isPlayer ? G.fireLevel : 0;
  G.bullets.push(new Bullet(bx, by, tank.dir, !tank.isPlayer, tank, power));
  Audio.shoot();
  tank.cooldown = tank.isPlayer ? 250 : 1500;
}

// ========== UPDATE ==========
function update() {
  if (G.state === 'stageIntro') {
    G.stageIntroTimer -= 16;
    if (G.stageIntroTimer <= 0) G.state = 'playing';
    return;
  }
  if (G.state !== 'playing') return;

  // Freeze timer
  if (G.freezeTimer > 0) G.freezeTimer -= 16;

  // Spawn player
  if (!G.player && G.lives > 0 && G.baseAlive) spawnPlayer();

  // Player input
  if (G.player && G.player.alive) {
    let p = G.player;
    if (p.invincible > 0) p.invincible -= 16;
    if (p.cooldown > 0) p.cooldown -= 16;
    let dx = 0, dy = 0, nd = p.dir;
    if (G.keys['ArrowUp']||G.keys['w']||G.keys['W']) { dy=-1; nd=U; }
    else if (G.keys['ArrowDown']||G.keys['s']||G.keys['S']) { dy=1; nd=D; }
    else if (G.keys['ArrowLeft']||G.keys['a']||G.keys['A']) { dx=-1; nd=L; }
    else if (G.keys['ArrowRight']||G.keys['d']||G.keys['D']) { dx=1; nd=R; }
    if (dx || dy) {
      p.dir = nd;
      let nx = p.x + dx * p.speed;
      let ny = p.y + dy * p.speed;
      if (canMove(p, nx, ny)) { p.x = nx; p.y = ny; }
    }
    if (G.keys[' '] || G.keys['Space']) fireBullet(p);

    // Pick up powerups
    for (let i = G.powerups.length - 1; i >= 0; i--) {
      let pu = G.powerups[i];
      if (!pu.alive) continue;
      if (p.x < pu.x + 22 && p.x + p.size > pu.x && p.y < pu.y + 22 && p.y + p.size > pu.y) {
        pu.alive = false;
        applyPowerup(pu.type);
        G.powerups.splice(i, 1);
      }
    }
  }

  // Enemy AI
  let frozen = G.freezeTimer > 0;
  for (let e of G.enemies) {
    if (!e.alive) continue;
    if (e.cooldown > 0) e.cooldown -= 16;
    if (frozen) continue;
    e.aiChange -= 16;
    e.moveTimer -= 16;
    if (G.player && G.player.alive && Math.random() < 0.02) {
      let dx = G.player.cx - e.cx;
      let dy = G.player.cy - e.cy;
      if (Math.abs(dx) > Math.abs(dy)) e.aiDir = dx > 0 ? R : L;
      else e.aiDir = dy > 0 ? D : U;
      e.aiChange = 500 + Math.random() * 500;
    }
    if (e.aiChange <= 0) {
      e.aiDir = Math.floor(Math.random() * 4);
      e.aiChange = 1000 + Math.random() * 2000;
    }
    let od = e.dir;
    e.dir = e.aiDir;
    let nx = e.x + DX[e.dir] * e.speed;
    let ny = e.y + DY[e.dir] * e.speed;
    if (canMove(e, nx, ny)) { e.x = nx; e.y = ny; }
    else { e.dir = od; if (e.moveTimer <= 0) { e.aiDir = Math.floor(Math.random() * 4); e.moveTimer = 400; } }
    if (Math.random() < 0.015 && e.cooldown <= 0) fireBullet(e);
  }

  // Bullets
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    let b = G.bullets[i];
    if (!b.alive) { G.bullets.splice(i, 1); continue; }
    b.x += DX[b.dir] * b.speed;
    b.y += DY[b.dir] * b.speed;
    if (b.x < -10 || b.x > W + 10 || b.y < -10 || b.y > H + 10) { b.alive = false; continue; }
    // Hit grid
    let gc = Math.floor((b.x + 2) / CS);
    let gr = Math.floor((b.y + 2) / CS);
    if (gr >= 0 && gr < ROW && gc >= 0 && gc < COL) {
      let tile = G.grid[gr][gc];
      if (tile === BRICK || tile === STEEL) {
        if (tile === STEEL && b.power < 1) {
          // Can't break steel - only destroy if power >= 1
          b.alive = false;
          addEffect(gc*CS, gr*CS, 100, '#fff');
          Audio.hit();
          continue;
        }
        G.grid[gr][gc] = EMPTY;
        b.alive = false;
        Audio.hit();
        addEffect(gc*CS, gr*CS, 200, tile===STEEL?'#aaa':'#d07030');
        continue;
      }
      if (tile === BASE) {
        G.grid[gr][gc] = EMPTY;
        b.alive = false;
        G.baseAlive = false;
        addEffect(gc*CS, gr*CS, 500, '#ff4400');
        Audio.explode();
        gameOver();
        continue;
      }
    }
    // Hit player
    if (b.isEnemy && G.player && G.player.alive) {
      if (b.x < G.player.x + G.player.size && b.x + 5 > G.player.x &&
          b.y < G.player.y + G.player.size && b.y + 5 > G.player.y) {
        b.alive = false;
        if (G.player.invincible <= 0) {
          G.player.alive = false;
          addEffect(G.player.x, G.player.y, 400, '#ff8020');
          Audio.explode();
          G.lives--;
          G.player = null;
          updateUI();
          if (G.lives <= 0) gameOver();
        }
      }
    }
    // Hit enemies
    if (!b.isEnemy) {
      for (let e of G.enemies) {
        if (!e.alive) continue;
        if (b.x < e.x + e.size && b.x + 5 > e.x &&
            b.y < e.y + e.size && b.y + 5 > e.y) {
          b.alive = false;
          e.hp--;
          if (e.hp <= 0) {
            e.alive = false;
            let score = ENEMY[e.etype].score;
            G.score += score;
            addEffect(e.x, e.y, 400, '#ff4400');
            addPopup(e.x + 5, e.y - 6, '+' + score, '#f0c040');
            Audio.hit();
            // Powerup drop: guaranteed if enemy carried one
            if (e.hasPowerup) spawnPowerup(e.x, e.y);
            else if (Math.random() < 0.25) spawnPowerup(e.x, e.y);
            updateUI();
          } else {
            addEffect(e.x, e.y, 150, '#fff');
            Audio.hit();
          }
          break;
        }
      }
    }
  }

  // Clear dead enemies
  G.enemies = G.enemies.filter(e => e.alive);

  // Spawn enemies
  G.spawnTimer += 16;
  if (G.spawnTimer >= 1000) { G.spawnTimer = 0; spawnEnemy(); }

  // Effects
  for (let i = G.effects.length - 1; i >= 0; i--) {
    G.effects[i].t -= 16;
    if (G.effects[i].t <= 0) G.effects.splice(i, 1);
  }

  // Popups
  for (let i = G.popups.length - 1; i >= 0; i--) {
    G.popups[i].t -= 16;
    G.popups[i].y -= 0.5;
    if (G.popups[i].t <= 0) G.popups.splice(i, 1);
  }

  // Powerup timers
  for (let i = G.powerups.length - 1; i >= 0; i--) {
    G.powerups[i].timer -= 16;
    G.powerups[i].bob += 0.05;
    if (G.powerups[i].timer <= 0) {
      G.powerups[i].alive = false;
      G.powerups.splice(i, 1);
    }
  }

  // Win check
  if (G.spawnQ.length === 0 && G.enemies.length === 0) {
    G.mapIdx = (G.mapIdx + 1) % MAPS.length;
    loadMap(G.mapIdx);
    spawnWave();
    G.player = null;
    G.powerups = [];
    G.freezeTimer = 0;
    G.fireLevel = 0;
    G.spawnIdx = 0;
    G.state = 'stageIntro';
    G.stageIntroTimer = 1000;
  }

  updateUI();
}

function applyPowerup(type) {
  switch (type) {
    case PT_STAR:
      if (G.fireLevel < 2) G.fireLevel++;
      addPopup(G.player.x, G.player.y - 10, '火力提升!', '#f0c040');
      break;
    case PT_SHIELD:
      if (G.player) G.player.invincible = Math.max(G.player.invincible, 5000);
      addPopup(G.player.x, G.player.y - 10, '护盾!', '#40c0f0');
      break;
    case PT_TANK:
      G.lives++;
      addPopup(G.player.x, G.player.y - 10, '+1命', '#40f040');
      break;
    case PT_CLOCK:
      G.freezeTimer = 5000;
      addPopup(G.player.x, G.player.y - 10, '时停!', '#8080ff');
      break;
    case PT_GRENADE:
      for (let e of G.enemies) {
        if (!e.alive) continue;
        e.alive = false;
        let score = ENEMY[e.etype].score;
        G.score += score;
        addEffect(e.x, e.y, 300, '#ff4400');
        addPopup(e.x + 5, e.y - 6, '+' + score, '#ff8040');
      }
      G.enemies = [];
      addPopup(G.player.x, G.player.y - 10, '全屏清除!', '#f04040');
      Audio.explode();
      updateUI();
      break;
  }
  updateUI();
}

function gameOver() {
  G.state = 'gameover';
  Audio.stopBG();
  Audio.gameover();
  if (G.score > G.highScore) {
    G.highScore = G.score;
    localStorage.setItem('battleCityHigh', G.highScore);
  }
  ol.innerHTML = '<h1 style="color:#f04040">GAME OVER</h1><p style="color:#aaa">得分: '+G.score+'</p><p style="color:#666">最高: '+G.highScore+'</p><p style="color:#fff;margin-top:12px">按 Enter 重新开始</p>';
  ol.classList.add('show');
}

// ========== RENDER ==========
function render() {
  // Background
  cx.fillStyle = '#1a1a1a';
  cx.fillRect(0, 0, W, H);

  // Grid
  for (let r = 0; r < ROW; r++) {
    for (let c = 0; c < COL; c++) {
      let x = c * CS, y = r * CS;
      switch (G.grid[r][c]) {
        case BRICK:
          cx.fillStyle = '#c06030';
          cx.fillRect(x, y, CS, CS);
          cx.fillStyle = '#d07040';
          cx.fillRect(x+2, y+2, CS/2-2, CS/2-2);
          cx.fillRect(x+CS/2+1, y+CS/2+1, CS/2-3, CS/2-3);
          cx.fillStyle = '#a04820';
          cx.fillRect(x+1, y+CS/2+1, CS/2-1, CS/2-3);
          cx.fillRect(x+CS/2+1, y+1, CS/2-3, CS/2-1);
          break;
        case STEEL:
          cx.fillStyle = '#888';
          cx.fillRect(x, y, CS, CS);
          cx.fillStyle = '#aaa';
          cx.fillRect(x+2, y+2, CS/2-2, CS/2-2);
          cx.fillRect(x+CS/2, y+CS/2, CS/2-2, CS/2-2);
          cx.strokeStyle = '#666';
          cx.strokeRect(x+0.5, y+0.5, CS-1, CS-1);
          break;
        case BASE:
          cx.fillStyle = '#1a1a1a';
          cx.fillRect(x, y, CS, CS);
          cx.fillStyle = '#f0c040';
          cx.beginPath();
          cx.moveTo(x+CS/2, y+4);
          cx.lineTo(x+CS/2+10, y+CS/3);
          cx.lineTo(x+CS/2, y+CS/3+4);
          cx.lineTo(x+CS/2-10, y+CS/3);
          cx.closePath();
          cx.fill();
          cx.fillRect(x+CS/2-2, y+CS/3, 4, CS/2);
          cx.fillStyle = '#f04040';
          cx.beginPath();
          cx.arc(x+CS/2, y+CS/3-2, 4, 0, Math.PI*2);
          cx.fill();
          break;
      }
    }
  }

  // Effects
  for (let fx of G.effects) {
    let a = fx.t / fx.max;
    let r = 8 + (1 - a) * 10;
    cx.globalAlpha = a;
    cx.fillStyle = fx.color;
    cx.beginPath();
    cx.arc(fx.x + CS/2, fx.y + CS/2, r, 0, Math.PI*2);
    cx.fill();
    cx.globalAlpha = 1;
  }

  // Power-ups
  for (let pu of G.powerups) {
    if (!pu.alive) continue;
    let px = pu.x, py = pu.y + Math.sin(pu.bob) * 2;
    let pulse = 1 + Math.sin(pu.bob * 2) * 0.08;
    // Background glow
    cx.globalAlpha = 0.3;
    cx.fillStyle = PT_COLOR[pu.type];
    cx.beginPath();
    cx.arc(px + 11, py + 11, 14, 0, Math.PI * 2);
    cx.fill();
    cx.globalAlpha = 1;
    // Box
    cx.fillStyle = '#222';
    cx.fillRect(px, py, 22, 22);
    cx.strokeStyle = PT_COLOR[pu.type];
    cx.lineWidth = 2;
    cx.strokeRect(px, py, 22, 22);
    // Symbol
    cx.fillStyle = PT_COLOR[pu.type];
    cx.font = 'bold 14px "Courier New", monospace';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.fillText(PT_CHAR[pu.type], px + 11, py + 11 + 1);
  }

  // Bullets
  for (let b of G.bullets) {
    if (!b.alive) continue;
    let col = b.isEnemy ? '#f88' : '#ff0';
    let blur = b.power >= 2 ? 10 : 6;
    cx.fillStyle = col;
    cx.shadowColor = col;
    cx.shadowBlur = blur;
    cx.fillRect(b.x, b.y, 5, 5);
    cx.shadowBlur = 0;
  }

  // Tanks
  function drawTank(t) {
    if (!t || !t.alive) return;
    cx.save();
    cx.translate(t.x + t.size/2, t.y + t.size/2);
    cx.rotate(t.dir * Math.PI/2);
    let s = t.size;
    let col;
    if (t.isPlayer) {
      col = {b:'#e8b830',d:'#c89820',t:'#d0a828'};
    } else {
      let ec = ENEMY[t.etype] || ENEMY[0];
      if (t.hasPowerup) {
        let flash = Math.sin(Date.now() / 100) > 0;
        if (flash) {
          col = {b:'#ff3030', d:'#cc1818', t:'#ee2424'};
        } else {
          col = {b:ec.body, d:ec.dark, t:ec.turret};
        }
      } else {
        col = {b:ec.body, d:ec.dark, t:ec.turret};
      }
    }
    // Tracks
    cx.fillStyle = col.d;
    cx.fillRect(-s/2, -s/2, 5, s);
    cx.fillRect(s/2-5, -s/2, 5, s);
    // Body
    cx.fillStyle = col.b;
    cx.fillRect(-s/2+5, -s/2, s-10, s);
    // Turret
    cx.fillStyle = col.t;
    cx.fillRect(-s/4, -s/4, s/2, s/2);
    // Barrel
    cx.fillStyle = col.d;
    cx.fillRect(-2.5, -s/2-2, 5, s/2+5);
    // Center
    cx.fillStyle = t.isPlayer ? '#b89820' : '#902828';
    cx.beginPath();
    cx.arc(0, 0, 4, 0, Math.PI*2);
    cx.fill();
    // HP indicator for armored enemies
    if (!t.isPlayer && t.hp > 1) {
      cx.fillStyle = '#fff';
      cx.font = 'bold 10px "Courier New", monospace';
      cx.textAlign = 'center';
      cx.textBaseline = 'top';
      cx.fillText(t.hp, 0, -s/2 - 6);
    }
    // Shield
    if (t.invincible > 0) {
      cx.strokeStyle = 'rgba(255,255,255,'+(0.3+Math.sin(Date.now()/80)*0.2)+')';
      cx.lineWidth = 2;
      cx.beginPath();
      cx.arc(0, 0, s/2+2, 0, Math.PI*2);
      cx.stroke();
    }
    cx.restore();
  }
  drawTank(G.player);
  for (let e of G.enemies) drawTank(e);

  // Score popups
  for (let pop of G.popups) {
    let a = pop.t / pop.max;
    cx.globalAlpha = a;
    cx.fillStyle = pop.color;
    cx.font = 'bold 13px "Courier New", monospace';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.fillText(pop.text, pop.x + 6, pop.y);
    cx.globalAlpha = 1;
  }

  // Stage intro overlay
  if (G.state === 'stageIntro') {
    cx.fillStyle = 'rgba(0,0,0,0.6)';
    cx.fillRect(0, 0, W, H);
    cx.fillStyle = '#f0c040';
    cx.font = 'bold 42px "Courier New", monospace';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.fillText('STAGE ' + G.wave, W/2, H/2 - 20);
    cx.font = '20px "Courier New", monospace';
    cx.fillStyle = '#fff';
    cx.fillText('第 ' + G.wave + ' 关', W/2, H/2 + 30);
  }

  // Pause overlay
  if (G.state === 'paused') {
    cx.fillStyle = 'rgba(0,0,0,0.5)';
    cx.fillRect(0, 0, W, H);
    cx.fillStyle = '#fff';
    cx.font = 'bold 36px "Courier New", monospace';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.fillText('PAUSED', W/2, H/2 - 8);
    cx.font = '14px "Courier New", monospace';
    cx.fillStyle = '#888';
    cx.fillText('按 P 继续', W/2, H/2 + 28);
  }
}

// ========== UI ==========
function updateUI() {
  document.getElementById('sScore').textContent = G.score;
  document.getElementById('sHigh').textContent = G.highScore;
  document.getElementById('sWave').textContent = G.wave;
  document.getElementById('sLives').textContent = G.lives;
  document.getElementById('sEnemy').textContent = G.spawnQ.length + G.enemies.length;
  // Fire level display
  let stars = '';
  if (G.fireLevel === 0) stars = '★☆☆';
  else if (G.fireLevel === 1) stars = '★★☆';
  else stars = '★★★';
  document.getElementById('sPower').textContent = stars;
}

// ========== MAIN LOOP ==========
function loop() {
  if (G.state === 'playing' || G.state === 'stageIntro') update();
  render();
  requestAnimationFrame(loop);
}

// ========== INPUT ==========
document.addEventListener('keydown', e => {
  G.keys[e.key] = true;
  if (e.key === 'Enter') {
    if (G.state === 'menu' || G.state === 'gameover') {
      G = newGame();
      G.keys = {};
      document.getElementById('overlay').innerHTML = '<h1>坦克大战</h1><h2>BATTLE CITY</h2><p>按 Enter 开始游戏</p><p style="color:#666;font-size:12px">↑↓←→ 移动 | 空格 开火 | P 暂停 | M 静音</p>';
      startGame();
    }
  }
  if (e.key === 'p' || e.key === 'P') {
    if (G.state === 'playing') {
      G.state = 'paused';
      if (Audio.ctx) Audio.ctx.suspend();
    } else if (G.state === 'paused') {
      G.state = 'playing';
      if (Audio.ctx) Audio.ctx.resume();
    }
  }
  if (e.key === 'm' || e.key === 'M') {
    G.soundOn = !G.soundOn;
    if (!G.soundOn && Audio.ctx) Audio.ctx.suspend();
    else if (G.soundOn && Audio.ctx && G.state !== 'paused') Audio.ctx.resume();
  }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter','p','P','m','M','w','W','s','S','a','A','d','D'].includes(e.key)) {
    e.preventDefault();
  }
});
document.addEventListener('keyup', e => { G.keys[e.key] = false; });

// ========== INIT ==========
G = newGame();
loadMap(0);
render();
loop();
</script>
